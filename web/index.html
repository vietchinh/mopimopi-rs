<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="images/menu/icon.png" />
  <link rel="apple-touch-icon" href="images/menu/icon.png" />
  <title>MopiMopi</title>
  <!-- NOTE: `dx` does not use this file (it generates its own page, and takes the links below from
       [web.resource] in Dioxus.toml); only build.sh does. Keep the two in step.
       The stylesheet tailwind.css and the @font-face rules of every font (the clock's,
       Roboto Condensed, Material Icons) are inserted by the app itself, see `App` in src/presentation/ui/app_shell.rs. -->
  <!-- The base layout: render-blocking, so the app's first frame is laid out (see the comment in Dioxus.toml). Copied to dist/ from public/. -->
  <link rel="stylesheet" href="base.css" />
  <!-- Same helper the original loaded: exposes OverlayPluginApi when running inside OverlayPlugin -->
  <script src="https://ngld.github.io/OverlayPlugin/assets/shared/common.min.js"></script>
  <!-- Applies with the very first paint, before any stylesheet has loaded: removes the browser's default
       8px <body> margin and sizes #main (where Dioxus mounts) to fill the window. Without this, the page
       would paint once with the browser's defaults and then jump into place once the real stylesheets
       load -- see the matching comment in Dioxus.toml, which needs the same rule for dx's generated page. -->
  <style>html,body{margin:0;background:transparent}
    #main{width:100%;height:100%}</style>
</head>
<body>
  <div id="main"></div>
  <script type="module">
    import init from "./pkg/mopimopi-dioxus.js";
    init();
  </script>
</body>
</html>
